[project]
name = "production-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kaviyarasan-R-K", email = "kavi94779@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography<45",
    "fastapi>=0.163.1",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "langsmith>=0.14.17",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
production-api = "production_api:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
